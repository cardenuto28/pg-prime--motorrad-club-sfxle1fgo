<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Você está offline | PG PRIME Club</title>
    <meta name="theme-color" content="#07090e" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #07090e;
        color: #f8fafc;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: linear-gradient(180deg, #10141d 0%, #0a0d14 100%);
        border: 1px solid #1e2638;
        border-radius: 16px;
        padding: 40px 24px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 102, 255, 0.08);
      }
      .logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 24px;
        border-radius: 16px;
        object-fit: contain;
        background: #000;
        padding: 8px;
        border: 1px solid #1e2638;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #fff;
        margin-bottom: 12px;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .badge {
        display: inline-block;
        background: rgba(0, 102, 255, 0.15);
        border: 1px solid rgba(0, 102, 255, 0.4);
        color: #60a5fa;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        background-color: #0066ff;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 14px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition:
          background-color 0.2s,
          transform 0.1s;
        text-decoration: none;
      }
      .btn:hover {
        background-color: #2563eb;
      }
      .btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/pwa-192x192.png" alt="PG PRIME Club" class="logo" />
      <div>
        <span class="badge">Modo Offline</span>
      </div>
      <h1>Sem conexão à internet</h1>
      <p>
        Não foi possível conectar aos servidores do PG PRIME Club. Verifique sua conexão móvel ou
        Wi-Fi para continuar navegando.
      </p>
      <button class="btn" onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
